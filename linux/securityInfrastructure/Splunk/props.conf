# =============================================================================
# Zeek Network Security Monitor (TSV format)
# =============================================================================
# Zeek logs use tab-separated values with a #separator header line.
# The #fields header defines column names.

[zeek:conn]
SHOULD_LINEMERGE = false
TRUNCATE = 10000
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 18
FIELD_DELIMITER = \t
FIELD_HEADER_REGEX = ^#fields\t(.*)
FIELD_NAMES = ts, uid, id.orig_h, id.orig_p, id.resp_h, id.resp_p, proto, service, duration, orig_bytes, resp_bytes, conn_state, local_orig, local_resp, missed_bytes, history, orig_pkts, orig_ip_bytes, resp_pkts, resp_ip_bytes, tunnel_parents

