# =============================================================================
# Zeek Network Security Monitor (TSV format)
# =============================================================================
# Zeek logs use tab-separated values with header comment lines.
# Lines starting with # are headers/metadata and should be filtered.
# Data lines start with Unix epoch timestamps.
#
# Key configuration:
# - SEDCMD filters out header lines starting with #
# - FIELD_DELIMITER extracts tab-separated fields
# - FIELD_NAMES defines explicit field names (required since header is filtered)
# - TIME_FORMAT parses Unix epoch timestamps with microseconds
# =============================================================================

[zeek:conn]
SHOULD_LINEMERGE = false
TRUNCATE = 10000
# Unix epoch timestamp with microseconds
TIME_PREFIX = ^
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 18
# Regex-based field extraction for Zeek conn.log (TSV format)
# Pattern: ts uid orig_h orig_p resp_h resp_p proto service duration orig_bytes resp_bytes conn_state ...
EXTRACT-zeek_conn = ^(?<ts>\d+\.\d+)\t(?<uid>[^\t]+)\t(?<id_orig_h>[^\t]+)\t(?<id_orig_p>[^\t]+)\t(?<id_resp_h>[^\t]+)\t(?<id_resp_p>[^\t]+)\t(?<proto>[^\t]+)\t(?<service>[^\t]*)\t(?<duration>[^\t]*)\t(?<orig_bytes>[^\t]*)\t(?<resp_bytes>[^\t]*)\t(?<conn_state>[^\t]*)\t(?<local_orig>[^\t]*)\t(?<local_resp>[^\t]*)\t(?<missed_bytes>[^\t]*)\t(?<history>[^\t]*)\t(?<orig_pkts>[^\t]*)\t(?<orig_ip_bytes>[^\t]*)\t(?<resp_pkts>[^\t]*)\t(?<resp_ip_bytes>[^\t]*)

