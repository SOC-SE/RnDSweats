SHOULD_LINEMERGE = false
TRUNCATE = 10000
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 18
FIELD_DELIMITER = \t
FIELD_HEADER_REGEX = ^#fields\t(.*)

